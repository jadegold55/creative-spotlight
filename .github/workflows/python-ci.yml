name: Python Bot CI

on:
  pull_request:
    paths:
      - "bot/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-bot:
    name: Python bot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check bot tests

      - name: Lint
        run: python -m ruff check bot tests

      - name: Run unit tests
        run: python -m pytest
