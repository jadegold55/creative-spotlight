name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/creative-spotlight
            git pull --ff-only origin main
            bash scripts/load-secrets.sh
            docker compose down --remove-orphans
            docker system prune -af
            docker builder prune -af
            docker compose up --build -d
            for attempt in $(seq 1 24); do
              bot_container="$(docker compose ps -q bot)"
              if [ -n "$bot_container" ] && [ "$(docker inspect -f '{{.State.Running}}' "$bot_container")" = "true" ]; then
                if docker compose logs --since=2m bot 2>&1 | grep -q "Logged in as"; then
                  docker compose ps
                  exit 0
                fi
              else
                docker compose logs --tail=200 bot
                exit 1
              fi
              sleep 5
            done
            echo "Bot did not report Discord login within 120 seconds."
            docker compose logs --tail=200 bot
            exit 1
